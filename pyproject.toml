[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doclens"
version = "0.1.0"
description = "A fine-tuned Vision-Language Model for structured document field extraction and tamper detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Moinuddin"},
]
keywords = [
    "document-extraction",
    "vision-language-model",
    "vlm",
    "lora",
    "fine-tuning",
    "ocr",
    "document-understanding",
    "tamper-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.28.0",
    "Pillow>=10.0",
    "albumentations>=1.3.0",
    "faker>=24.0",
    "datasets>=2.18.0",
    "jsonschema>=4.21.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0",
    "qwen-vl-utils>=0.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3.0",
]
render = [
    "weasyprint>=60.0",
]

[project.urls]
Homepage = "https://github.com/Moinuddinshaik-code/Doclens"
Repository = "https://github.com/Moinuddinshaik-code/Doclens"
Issues = "https://github.com/Moinuddinshaik-code/Doclens/issues"

[project.scripts]
doclens = "doclens.extractor:main"

[tool.setuptools.packages.find]
include = ["doclens*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
